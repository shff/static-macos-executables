name: imagemagick
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      IMAGEMAGICK_VERSION: 7.1.2-31
      CFLAGS: -Os
      CXXFLAGS: -Os
    steps:
      - run: git clone --depth 1 --branch "$IMAGEMAGICK_VERSION" https://github.com/ImageMagick/ImageMagick.git ImageMagick
      - run: cd ImageMagick && ./configure --disable-shared --enable-static --without-modules --without-magick-plus-plus --without-perl --without-x --disable-openmp
      - run: make -C ImageMagick -j$(sysctl -n hw.ncpu)
      - run: strip ImageMagick/utilities/magick
      - uses: actions/upload-artifact@v4
        with:
          name: magick
          path: ImageMagick/utilities/magick
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="imagemagick-$IMAGEMAGICK_VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" ImageMagick/utilities/magick --clobber
          else
            gh release create "$tag" ImageMagick/utilities/magick \
              --title "ImageMagick $IMAGEMAGICK_VERSION" \
              --generate-notes
          fi
